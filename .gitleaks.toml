# Keep all upstream detection rules. Only generated artifacts are excluded.
[extend]
useDefault = true

[allowlist]
description = "Reproducible build/dependency artifacts, never application sources"
paths = [
  # Next creates ephemeral encryption material in its build and dev cache.
  '''(^|/)\.next/''',
  # Installed dependency copies and test coverage output are regenerated locally.
  '''(^|/)node_modules/''',
  '''(^|/)coverage/''',
  # TypeScript incremental build metadata, not authored code.
  '''\.tsbuildinfo$''',
]
